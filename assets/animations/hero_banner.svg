<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#0f0f15"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9eff00"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9eff00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#9eff00" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 15px rgba(158,255,0,0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 30px rgba(0,229,255,0.7)); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes sweepGrid {
      0% { opacity: 0.15; }
      50% { opacity: 0.35; }
      100% { opacity: 0.15; }
    }
    @keyframes streamDot {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes eqBar {
      0%, 100% { height: 12px; }
      50% { height: 38px; }
    }
    .brand-glow { animation: pulseGlow 4s ease-in-out infinite; }
    .floating { animation: floatCard 6s ease-in-out infinite; }
    .grid-bg { animation: sweepGrid 5s ease-in-out infinite; }
    .wire { stroke-dasharray: 8 8; animation: streamDot 15s linear infinite; }
    .eq-1 { animation: eqBar 1.2s ease-in-out infinite; }
    .eq-2 { animation: eqBar 0.9s ease-in-out infinite 0.2s; }
    .eq-3 { animation: eqBar 1.5s ease-in-out infinite 0.4s; }
    .eq-4 { animation: eqBar 1.1s ease-in-out infinite 0.1s; }
    .eq-5 { animation: eqBar 1.3s ease-in-out infinite 0.3s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="376" x="2" y="2" rx="15" fill="none" stroke="#22222d" stroke-width="1.5"/>

  <!-- Matrix Mesh Grid -->
  <g class="grid-bg" stroke="#1d1d28" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="250" y1="0" x2="250" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="550" y1="0" x2="550" y2="380"/>
    <line x1="700" y1="0" x2="700" y2="380"/>
    <line x1="850" y1="0" x2="850" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
    <line x1="1150" y1="0" x2="1150" y2="380"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Flowing Circuit Line -->
  <path d="M 60 80 L 300 80 L 340 120 L 760 120 L 800 80 L 1140 80" fill="none" stroke="#9eff00" stroke-width="1.5" stroke-opacity="0.3" class="wire"/>
  <path d="M 120 300 L 480 300 L 520 260 L 980 260 L 1020 300 L 1140 300" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.3" class="wire"/>

  <!-- Main Branding -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <rect x="0" y="-45" width="230" height="28" rx="14" fill="#151520" stroke="#2d2d40" stroke-width="1"/>
    <circle cx="16" cy="-31" r="5" fill="#9eff00"/>
    <text x="30" y="-26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#9eff00" letter-spacing="1.5">CREATOR OPERATING SYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Clipyx<tspan fill="#9eff00">.</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#9898aa">
      The Complete AI Suite for Video Planning, DaVinci Resolve &amp; Procedural Motion
    </text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(0, 125)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#14141c" stroke="#282836" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#9eff00"/>
      <text x="32" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#e0e0ea">Planizo Web App</text>

      <!-- Badge 2 -->
      <rect x="180" y="0" width="175" height="36" rx="8" fill="#14141c" stroke="#282836" stroke-width="1"/>
      <circle cx="198" cy="18" r="4" fill="#00e5ff"/>
      <text x="212" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#e0e0ea">319+ Resolve Assets</text>

      <!-- Badge 3 -->
      <rect x="370" y="0" width="165" height="36" rx="8" fill="#14141c" stroke="#282836" stroke-width="1"/>
      <circle cx="388" cy="18" r="4" fill="#ff0077"/>
      <text x="402" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#e0e0ea">Textizo AI Presets</text>

      <!-- Badge 4 -->
      <rect x="550" y="0" width="170" height="36" rx="8" fill="#14141c" stroke="#282836" stroke-width="1"/>
      <circle cx="568" cy="18" r="4" fill="#ffe600"/>
      <text x="582" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#e0e0ea">Qwen3-ASR Engine</text>
    </g>
  </g>

  <!-- Interactive Graphic / Equalizer / HUD on the Right -->
  <g transform="translate(860, 80)" class="floating">
    <rect width="260" height="210" rx="14" fill="#101018" stroke="#28283a" stroke-width="1.5" filter="url(#cardGlow)"/>
    
    <!-- Header of HUD -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#181824"/>
    <path d="M 28 26 L 40 34 L 28 42 Z" fill="#9eff00"/>
    <text x="62" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Clipyx Engine</text>
    <text x="62" y="47" font-family="monospace" font-size="11" fill="#75758a">v2.4.0 • Localhost:8765</text>

    <!-- Equalizer Animation -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="220" height="50" rx="6" fill="#09090d"/>
      <text x="12" y="30" font-family="monospace" font-size="11" fill="#5c5c70">AUDIO SYNC</text>
      <!-- Equalizer Bars -->
      <rect x="130" y="38" width="6" height="12" rx="3" fill="#9eff00" class="eq-1" transform="rotate(180 133 38)"/>
      <rect x="144" y="38" width="6" height="18" rx="3" fill="#9eff00" class="eq-2" transform="rotate(180 147 38)"/>
      <rect x="158" y="38" width="6" height="28" rx="3" fill="#00e5ff" class="eq-3" transform="rotate(180 161 38)"/>
      <rect x="172" y="38" width="6" height="22" rx="3" fill="#00e5ff" class="eq-4" transform="rotate(180 175 38)"/>
      <rect x="186" y="38" width="6" height="34" rx="3" fill="#9eff00" class="eq-5" transform="rotate(180 189 38)"/>
      <rect x="200" y="38" width="6" height="15" rx="3" fill="#9eff00" class="eq-2" transform="rotate(180 203 38)"/>
    </g>

    <!-- Status metric -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="105" height="42" rx="6" fill="#14141c" stroke="#222230"/>
      <text x="10" y="16" font-family="sans-serif" font-size="10" fill="#7a7a90">LIBRARY</text>
      <text x="10" y="34" font-family="monospace" font-size="16" font-weight="700" fill="#9eff00">319 ITEMS</text>

      <rect x="115" y="0" width="105" height="42" rx="6" fill="#14141c" stroke="#222230"/>
      <text x="125" y="16" font-family="sans-serif" font-size="10" fill="#7a7a90">FUSION PRESETS</text>
      <text x="125" y="34" font-family="monospace" font-size="16" font-weight="700" fill="#00e5ff">22 BUILTIN</text>
    </g>
  </g>
</svg>