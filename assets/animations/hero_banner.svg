<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#0f0f15"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9eff00"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#9eff00" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes sweepGrid {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }
    @keyframes streamDot {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .grid-bg { animation: sweepGrid 5s ease-in-out infinite; }
    .wire { stroke-dasharray: 8 8; animation: streamDot 15s linear infinite; }
    .status-pulse { animation: pulseGlow 2s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="376" x="2" y="2" rx="15" fill="none" stroke="#22222d" stroke-width="1.5"/>

  <!-- Matrix Mesh Grid -->
  <g class="grid-bg" stroke="#1d1d28" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="250" y1="0" x2="250" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="550" y1="0" x2="550" y2="380"/>
    <line x1="700" y1="0" x2="700" y2="380"/>
    <line x1="850" y1="0" x2="850" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
    <line x1="1150" y1="0" x2="1150" y2="380"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Flowing Circuit Line -->
  <path d="M 60 80 L 300 80 L 340 120 L 760 120 L 800 80 L 1140 80" fill="none" stroke="#9eff00" stroke-width="1.5" stroke-opacity="0.3" class="wire"/>
  <path d="M 120 300 L 480 300 L 520 260 L 980 260 L 1020 300 L 1140 300" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.3" class="wire"/>

  <!-- Left: Main Branding Content -->
  <g transform="translate(70, 95)">
    <!-- Pill Badge -->
    <rect x="0" y="-35" width="225" height="26" rx="13" fill="#14141e" stroke="#2a2a3c" stroke-width="1"/>
    <circle cx="14" cy="-22" r="4.5" fill="#9eff00" class="status-pulse"/>
    <text x="28" y="-17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#9eff00" letter-spacing="1.2">CREATOR OPERATING SYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Clipyx<tspan fill="#9eff00">.</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#9898aa">
      The Complete AI Suite for Video Planning, DaVinci Resolve &amp; Procedural Motion
    </text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(0, 126)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#13131c" stroke="#252535" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#9eff00"/>
      <text x="28" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#e0e0ea">Planizo Web App</text>

      <!-- Badge 2 -->
      <rect x="172" y="0" width="170" height="34" rx="8" fill="#13131c" stroke="#252535" stroke-width="1"/>
      <circle cx="188" cy="17" r="4" fill="#00e5ff"/>
      <text x="200" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#e0e0ea">319+ Resolve Assets</text>

      <!-- Badge 3 -->
      <rect x="354" y="0" width="160" height="34" rx="8" fill="#13131c" stroke="#252535" stroke-width="1"/>
      <circle cx="370" cy="17" r="4" fill="#ff0077"/>
      <text x="382" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#e0e0ea">Textizo AI Presets</text>

      <!-- Badge 4 -->
      <rect x="526" y="0" width="165" height="34" rx="8" fill="#13131c" stroke="#252535" stroke-width="1"/>
      <circle cx="542" cy="17" r="4" fill="#ffe600"/>
      <text x="554" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#e0e0ea">Qwen3-ASR Engine</text>
    </g>
  </g>

  <!-- Right: Floating HUD Card with Native SVG Translation Animation -->
  <g id="hudCard" filter="url(#cardGlow)">
    <animateTransform attributeName="transform" type="translate" values="840,75; 840,68; 840,75" dur="4.5s" repeatCount="indefinite" ease="easeInOut"/>
    
    <rect width="280" height="225" rx="14" fill="#101018" stroke="#272738" stroke-width="1.5"/>
    
    <!-- Header of HUD -->
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#181824"/>
    <path d="M 30 28 L 42 36 L 30 44 Z" fill="#9eff00"/>
    <text x="66" y="34" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Clipyx Engine</text>
    <text x="66" y="49" font-family="monospace" font-size="11" fill="#78788f">v2.4.0 • Localhost:8765</text>

    <!-- Equalizer Section -->
    <g transform="translate(18, 75)">
      <rect x="0" y="0" width="244" height="54" rx="8" fill="#09090e" stroke="#1d1d29"/>
      <text x="14" y="32" font-family="monospace" font-size="11" font-weight="600" fill="#626278" letter-spacing="0.5">AUDIO SYNC</text>
      
      <!-- Animated Equalizer Bars using native SVG animate -->
      <!-- Bar 1 -->
      <rect x="142" y="34" width="7" height="12" rx="3.5" fill="#9eff00">
        <animate attributeName="height" values="10;28;14;34;10" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="36;18;32;12;36" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 2 -->
      <rect x="156" y="30" width="7" height="18" rx="3.5" fill="#9eff00">
        <animate attributeName="height" values="16;36;12;24;16" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;10;34;22;30" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 3 -->
      <rect x="170" y="24" width="7" height="26" rx="3.5" fill="#00e5ff">
        <animate attributeName="height" values="24;14;38;20;24" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="22;32;8;26;22" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 4 -->
      <rect x="184" y="32" width="7" height="16" rx="3.5" fill="#00e5ff">
        <animate attributeName="height" values="14;32;20;38;14" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="32;14;26;8;32" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 5 -->
      <rect x="198" y="28" width="7" height="20" rx="3.5" fill="#9eff00">
        <animate attributeName="height" values="20;36;12;28;20" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="26;10;34;18;26" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 6 -->
      <rect x="212" y="35" width="7" height="10" rx="3.5" fill="#9eff00">
        <animate attributeName="height" values="10;26;16;32;10" dur="1.0s" repeatCount="indefinite"/>
        <animate attributeName="y" values="36;20;30;14;36" dur="1.0s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Metrics Row -->
    <g transform="translate(18, 146)">
      <rect x="0" y="0" width="116" height="52" rx="8" fill="#13131d" stroke="#20202e"/>
      <text x="12" y="19" font-family="sans-serif" font-size="10" font-weight="600" fill="#75758c">LIBRARY</text>
      <text x="12" y="39" font-family="monospace" font-size="15" font-weight="700" fill="#9eff00">319 ITEMS</text>

      <rect x="128" y="0" width="116" height="52" rx="8" fill="#13131d" stroke="#20202e"/>
      <text x="140" y="19" font-family="sans-serif" font-size="10" font-weight="600" fill="#75758c">FUSION PRESETS</text>
      <text x="140" y="39" font-family="monospace" font-size="15" font-weight="700" fill="#00e5ff">22 BUILTIN</text>
    </g>
  </g>
</svg>