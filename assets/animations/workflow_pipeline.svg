<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240">
  <defs>
    <linearGradient id="wfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9eff00"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes marchLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-line {
      stroke: url(#wfGrad);
      stroke-width: 3;
      stroke-dasharray: 6 8;
      animation: marchLine 5s linear infinite;
    }
    .step-title { font-family: sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .step-desc { font-family: monospace; font-size: 11px; fill: #8a8a9e; }
  </style>

  <rect width="1200" height="240" rx="14" fill="#0d0d12" stroke="#22222f"/>

  <!-- Connecting Rail -->
  <path d="M 120 100 L 1080 100" fill="none" class="flow-line"/>

  <!-- Step 1 -->
  <g transform="translate(80, 50)">
    <circle cx="40" cy="50" r="22" fill="#161622" stroke="#9eff00" stroke-width="2"/>
    <text x="40" y="55" font-family="sans-serif" font-size="14" font-weight="800" fill="#9eff00" text-anchor="middle">01</text>
    <text x="40" y="95" class="step-title" text-anchor="middle">Script &amp; B-Roll</text>
    <text x="40" y="115" class="step-desc" text-anchor="middle">Planizo Whiteboard</text>
    <text x="40" y="130" font-family="monospace" font-size="10" fill="#9eff00" text-anchor="middle">clipyx plan script</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(320, 50)">
    <circle cx="40" cy="50" r="22" fill="#161622" stroke="#00e5ff" stroke-width="2"/>
    <text x="40" y="55" font-family="sans-serif" font-size="14" font-weight="800" fill="#00e5ff" text-anchor="middle">02</text>
    <text x="40" y="95" class="step-title" text-anchor="middle">Schedule Pipeline</text>
    <text x="40" y="115" class="step-desc" text-anchor="middle">Planizo Calendar</text>
    <text x="40" y="130" font-family="monospace" font-size="10" fill="#00e5ff">clipyx serve</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(560, 50)">
    <circle cx="40" cy="50" r="22" fill="#161622" stroke="#ff0077" stroke-width="2"/>
    <text x="40" y="55" font-family="sans-serif" font-size="14" font-weight="800" fill="#ff0077" text-anchor="middle">03</text>
    <text x="40" y="95" class="step-title" text-anchor="middle">Resolve Presets</text>
    <text x="40" y="115" class="step-desc" text-anchor="middle">Clipyx 319 Library</text>
    <text x="40" y="130" font-family="monospace" font-size="10" fill="#ff0077">clipyx library search</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(800, 50)">
    <circle cx="40" cy="50" r="22" fill="#161622" stroke="#d946ef" stroke-width="2"/>
    <text x="40" y="55" font-family="sans-serif" font-size="14" font-weight="800" fill="#d946ef" text-anchor="middle">04</text>
    <text x="40" y="95" class="step-title" text-anchor="middle">Kinetic Typography</text>
    <text x="40" y="115" class="step-desc" text-anchor="middle">Textizo AI Generator</text>
    <text x="40" y="130" font-family="monospace" font-size="10" fill="#d946ef">clipyx preset check</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(1040, 50)">
    <circle cx="40" cy="50" r="22" fill="#161622" stroke="#ffe600" stroke-width="2"/>
    <text x="40" y="55" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffe600" text-anchor="middle">05</text>
    <text x="40" y="95" class="step-title" text-anchor="middle">Offline Subtitles</text>
    <text x="40" y="115" class="step-desc" text-anchor="middle">Qwen3-ASR Engine</text>
    <text x="40" y="130" font-family="monospace" font-size="10" fill="#ffe600">tools/transcribe</text>
  </g>
</svg>